name: Bug report
description: Something in the editor doesn't work, or a world doesn't load right in the game.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. One problem per report, please.
  - type: input
    id: version
    attributes:
      label: Editor version
      description: Shown in **Help > About**.
      placeholder: 2.0.0-beta.4
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version
      placeholder: V 3.4.0
  - type: dropdown
    id: size
    attributes:
      label: World size
      options:
        - Not about a world
        - 2048
        - 4096
        - 6144
        - 8192
        - 10240
        - 16384
        - Other
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      options:
        - In the editor
        - In the game, on a world the editor saved or exported
        - Installing or updating
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool or stage
      description: The tool, or the Generate stage (1-6), that you used.
      placeholder: Stage 4 (Highways)
  - type: input
    id: coords
    attributes:
      label: Coordinates in the game
      description: For a problem at one place in the game (for example a step in a road). Type the coordinates from the game's map or compass. Coordinates in a screenshot are often too small to read.
      placeholder: 1183 E, 939 S
  - type: input
    id: world
    attributes:
      label: Exported world
      description: The name of the world folder you exported to, in GeneratedWorlds.
      placeholder: MyWorld
  - type: dropdown
    id: save
    attributes:
      label: Game save
      description: A save keeps the ground of the places it already loaded, so an old save can still show a problem that an export fixed.
      options:
        - Not about the game
        - A new game, started after the last export
        - A save that was played before the last export
        - I don't know
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: |
        1. New World, 8192, Several islands
        2. Run stages 1 to 4
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Screenshots, crash.log, project
      description: |
        If the editor crashed, attach `crash.log` from `%APPDATA%\7D2DMapEditor`.
        For a problem in the game, attach:
        - the project (`.7dmap`, zipped), as it was when you exported. If you changed it after the export, attach the older copy.
        - a screenshot in the game, and a screenshot in the editor with the pointer on the same place.
        Also say if **Validate** (F7) shows the problem.
        Drag files into this box. Zip a `.7dmap` project if the problem needs it.
